<tr>
    <th scope="row">{{customer().id}}</th>
    <td>{{customer().userId}}</td>
    <td><input type="checkbox" disabled [checked]="customer().isActive"/></td>
    <td>@if(customer().vatNumber === null 
    || customer().vatNumber === undefined 
    || customer().vatNumber === ''){
            <span>/</span>
        }
        @else
        {
            {{customer().vatNumber}}
        }
    </td>
    <td>
        <button type="button" class="edit">
            Edit
        </button>
        <button type="button" class="delete">
            Delete
        </button>
    </td>
</tr>
