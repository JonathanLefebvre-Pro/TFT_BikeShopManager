<tr>
    <th scope="row">{{customer().id}}</th>
    <td>{{customer().userId}}</td>
    <td><input type="checkbox" disabled [checked]="customer().isActive"/></td>
    @if(!isEditModeEnabled()) {
        <td>
            @if(customer().vatNumber === null 
            || customer().vatNumber === undefined 
            || customer().vatNumber === ''){
                <span>/</span>
            }
            @else
            {
                {{customer().vatNumber}}
            }
        </td>
    }@else {
        <td><input type="text" [value]="customer().vatNumber"/></td>
    }
    <td>
        @if(!isEditModeEnabled())
        {
            <button type="button" class="edit" [disabled]="!customer().isActive" (click)="editCustomer()">
                Edit
            </button>
        }@else {
            <button type="button" class="save" (click)="saveCustomer()">
                Save
            </button>
        }

        @if(customer().isActive)
        {
            <button type="button" class="disable" (click)="disableCustomer()">
                Disable
            </button>
        }@else {
            <button type="button" class="enable" (click)="enableCustomer()">
                Enable
            </button>
        }
    </td>
</tr>
