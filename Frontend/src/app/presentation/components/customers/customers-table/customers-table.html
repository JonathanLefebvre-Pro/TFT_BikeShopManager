<table class="customerTable">
    <thead class="customerTableHead">
        <tr>
            <th scope="col">#</th>
            <th scope="col">FirstName</th>
            <th scope="col">LastName</th>
            <th scope="col">Email</th>
            <th scope="col">PhoneNumber</th>
            <th scope="col">Address</th>
            <th scope="col">City</th>
            <th scope="col">ZipCode</th>
            <th scope="col">Country</th>
            <th scope="col">BirthDate</th>
            <th scope="col">AllowMarketing</th>
            <th scope="col">IsActive</th>
            <th scope="col">VatNumber</th>
            <th scope="col">Actions</th>
        </tr>
    </thead>
    <tbody class="customerTableBody">
        @if(customers() !== null && customers().length > 0)
        {

            @for (customer of customers(); track customer.id) {
                <app-customer-table-row #customerTableRow
                [customer]="customer" 
                (onEnableCustomerEvent)="handleCustomerEnable($event)"
                (onDisableCustomerEvent)="handleCustomerDisable($event)"
                (onEditCustomerEvent)="handleCustomerEdit($event)"/>
            }
        }@else {
            <p>There is no customers !</p>
        }
    </tbody>
</table>
