<h1>View Customers</h1>

<app-customer-search-input 
(onSearchCustomers)="handleSearchCustomers($event)" 
(onClearSearchCustomers)="handleClearSearchCustomers()" />

<app-customers-table #customersTable
[customers]="customers()"
[currentPageNumber]="pageNumber()"
[maxPagesNumber]="totalPages()"
(onEnableCustomerEvent)="handleEnableCustomer($event)"
(onDisableCustomerEvent)="handleDisableCustomer($event)"
(onEditCustomerEvent)="handleEditCustomer($event)"
(onNextPageEvent)="handleNextCustomerPage()"
(onPreviousPageEvent)="handlePreviousCustomerPage()"/>
