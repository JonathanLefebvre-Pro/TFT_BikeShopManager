<tr>
    <th scope="row">{{customer().user.id}}</th>
    <td>{{customer().user.firstName}}</td>
    <td>{{customer().user.lastName}}</td>
    <td>{{customer().user.email}}</td>
    <td>{{customer().user.phoneNumber}}</td>
    <td>{{customer().user.address}}</td>
    <td>{{customer().user.city}}</td>
    <td>{{customer().user.zipCode}}</td>
    <td>{{customer().user.country}}</td>
    <td>{{customer().user.birthDate | date:'shortDate'}}</td>
    <td><input type="checkbox" disabled [checked]="customer().user.allowMarketing"/></td>
    <td>
        <button type="button" class="edit" [disabled]="!customer().isActive">
            Edit
        </button>
    </td>
</tr>
