@if(isLoaded()) {
    <app-customers-table 
    [customers]="customers()"
    (onEnableCustomerEvent)="handleEnableCustomer($event)"
    (onDisableCustomerEvent)="handleDisableCustomer($event)"
    (onEditCustomerEvent)="handleEditCustomer($event)"/>
}
@else {
    <p>There is no customers !</p>
}

@if(isLoaded() && lastEditedCustomer() !== null) {
    <app-customer-edit-panel 
    [customer]="lastEditedCustomer()!" 
    (onUpdateCustomerEvent)="handleUpdateCustomer($event)"/>
}

<app-add-customer/>
