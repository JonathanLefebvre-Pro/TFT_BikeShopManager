@defer(when isLoading()) {
    <h1>Edit Selected Customer</h1>
    
    <app-customer-edit-panel #customerEditPanel
    [customer]="lastEditedCustomer()!"
    (onUpdateCustomerEvent)="handleUpdateCustomer($event)"
    (onCancelUpdateCustomerEvent)="handleCancelUpdateCustomer()"/>
}
@placeholder {
    <p>Please select a Customer to edit his details !</p>
}
@loading(after 100ms; minimum 1s) {
    <p>Customer details are loading !</p>
}
@error {
    <div>Loading error !</div>
}
