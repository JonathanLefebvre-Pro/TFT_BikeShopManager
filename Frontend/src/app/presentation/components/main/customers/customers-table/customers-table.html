<table>
    <thead>
        <tr>
            @for (header of headers(); track $index) {
                <th scope="col">{{header}}</th>
            }
        </tr>
    </thead>
    <tbody>
        @for (customer of customers(); track customer.id) {
            <app-customer-table-row #customerTableRow
            [customer]="customer" 
            (onEnableCustomerEvent)="handleEnableCustomer($event)"
            (onDisableCustomerEvent)="handleDisableCustomer($event)"
            (onEditCustomerEvent)="handleEditCustomer($event)"
            (onDisplayDetailsCustomerEvent)="handleDisplayCustomerDetails($event)"/>
        }@empty {
            <p>{{errorMessage()}}</p>
        }
    </tbody>
    <tfoot>
        @if(maxPagesNumber() > 0){
            <input type="button" value="<" (click)="handleToPreviousPage()"/>
            {{currentPageNumber()}}/{{maxPagesNumber()}}
            <input type="button" value=">" (click)="handleToNextPage()"/>
        }
    </tfoot>
</table>
