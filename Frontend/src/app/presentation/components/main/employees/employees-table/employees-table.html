<table class="employeeTable">
    <thead class="employeeTableHead">
        <tr>
            @for (header of headers(); track $index) {
                <th scope="col">{{header}}</th>
            }
        </tr>
    </thead>
    <tbody class="employeeTableBody">
        @for (employee of employees(); track employee.id) {
            <app-employee-table-row #employeeTableRow
            [employee]="employee" 
            [disableActivationButton]="authUser()?.id === employee.id"
            (onEnableEmployeeEvent)="handleEnableEmployee($event)"
            (onDisableEmployeeEvent)="handleDisableEmployee($event)"
            (onEditEmployeeEvent)="handleEditEmployee($event)"
            (onDisplayDetailsEmployeeEvent)="handleDisplayEmployeeDetails($event)"/>
        }@empty {
            <p>{{errorMessage()}}</p>
        }
    </tbody>
    <tfoot class="employeeTableFooter">
        @if(maxPagesNumber() > 0){
            <input type="button" value="<" (click)="handleToPreviousPage()"/>
            {{currentPageNumber()}}/{{maxPagesNumber()}}
            <input type="button" value=">" (click)="handleToNextPage()"/>
        }
    </tfoot>
</table>
