<form method="post" class="submitEmployeeForm" [formRoot]="employeeForm">

    <app-form-text-input label="Password : " id="Password" type="password" [field]="employeeForm.password" [fieldState]="employeeForm.password()"/>
    <app-form-text-input label="Password confirm : " id="PasswordConfirm" type="password" [field]="employeeForm.passwordConfirm" [fieldState]="employeeForm.passwordConfirm()"/>
    
    <app-form-date-input label="Hired At : " id="HiredAt" [field]="employeeForm.hiredAt" [fieldState]="employeeForm.hiredAt()"/>
    <app-form-date-input label="Contract End At : " id="ContractEndAt" [field]="employeeForm.contractEndAt" [fieldState]="employeeForm.contractEndAt()"/>

    <app-form-text-input label="FirstName : " id="FirstName" [field]="employeeForm.firstName" [fieldState]="employeeForm.firstName()"/>
    <app-form-text-input label="Lastname : " id="Lastname" [field]="employeeForm.lastName" [fieldState]="employeeForm.lastName()"/>
    <app-form-text-input label="Email : " id="Email" type="email" [field]="employeeForm.email" [fieldState]="employeeForm.email()"/>
    <app-form-text-input label="Phone number : " id="PhoneNumber" [field]="employeeForm.phoneNumber" [fieldState]="employeeForm.phoneNumber()"/>
    <app-form-text-input label="Address : " id="Address" [field]="employeeForm.address" [fieldState]="employeeForm.address()"/>
    <app-form-text-input label="City : " id="City" [field]="employeeForm.city" [fieldState]="employeeForm.city()"/>
    <app-form-text-input label="Zip Code : " id="ZipCode" [field]="employeeForm.zipCode" [fieldState]="employeeForm.zipCode()"/>
    <app-form-text-input label="Country : " id="Country" [field]="employeeForm.country" [fieldState]="employeeForm.country()"/>
    <app-form-date-input label="Birthdate : " id="Birthdate" [field]="employeeForm.birthDate" [fieldState]="employeeForm.birthDate()"/>
    <app-form-checkbox-input label="Allow marketing : " id="AllowMarketing" [field]="employeeForm.allowMarketing" [fieldState]="employeeForm.allowMarketing()"/>
    
    <app-form-select-input label="Role : " id="RoleId" [fieldState]="employeeForm.roleId()" [options]="roleSelectOptions()"/>

    <div class="formGroup-Submit">
        <input type="submit" value="Create" [disabled]="employeeForm().invalid()"/>
    </div>

</form>
