@defer(when isLoading()) {
    <h1>Edit Selected Employee</h1>
    
    <app-employee-edit-panel #editPanel
    [employee]="lastEditedEmployee()!"
    [roleSelectOptions]="roleOptions()"
    (onUpdateEmployeeEvent)="handleUpdateEmployee($event)"
    (onCancelUpdateEmployeeEvent)="handleCancelUpdateEmployee()"/>
}
@placeholder {
    <p>Please select an Employee to edit his details !</p>
}
@loading(after 100ms; minimum 1s) {
    <p>Employee details are loading !</p>
}
@error {
    <div>Loading error !</div>
}
