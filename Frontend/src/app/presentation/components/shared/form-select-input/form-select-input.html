<div class="formNumberInput-{{id()}}">
    <label [for]="id()">{{label()}}</label>

    <select 
        [id]="id()" 
        [value]="fieldState()" 
        (change)="fieldState().value.set(+$any($event.target).value)"
        (blur)="fieldState().markAsTouched()">
        @for (option of options(); track $index) {
            <option [value]="$index+1" [selected]="fieldState().value() === $index+1">{{option}}</option>
        }
    </select>

    @if (fieldState().invalid() && fieldState().touched()) {
        <div class="error">
        @for (error of fieldState().errors(); track error.kind) {
            <span class="error-message">{{ error.message }}</span>
        }
        </div>
    }
</div>
