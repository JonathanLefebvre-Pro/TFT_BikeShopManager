<tr>
    <th scope="row">{{user().id}}</th>
    <td>{{user().firstName}}</td>
    <td>{{user().lastName}}</td>
    <td>{{user().email}}</td>
    <td>{{user().phoneNumber}}</td>
    <td>{{user().address}}</td>
    <td>{{user().city}}</td>
    <td>{{user().zipCode}}</td>
    <td>{{user().country}}</td>
    <td>{{user().birthDate | date:'shortDate'}}</td>
    <td><input type="checkbox" disabled [checked]="user().allowMarketing"/></td>
    <td>
        <button type="button" class="edit">
            Edit
        </button>
    </td>
</tr>
