networks:
  bikeshopmanager-network:
    name: bikeshopmanager-network
    driver: bridge

volumes:
  bikeshopmanager-db-data:
    name: bikeshopmanager-db-data
  bikeshopmanager-vault-data: 
    name: bikeshopmanager-vault-data

services:
  bikeshopmanager-db:
    container_name: bikeshopmanager-db
    image: mcr.microsoft.com/mssql/server:2019-latest
    ports:
      - 8002:1433
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    networks:
      - bikeshopmanager-network
    volumes:
      - bikeshopmanager-db-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  bikeshopmanager-db-init:
    container_name: bikeshopmanager-db-init
    image: mcr.microsoft.com/mssql/server:2019-latest
    depends_on:
      bikeshopmanager-db:
        condition: service_healthy
    environment:
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    networks:
      - bikeshopmanager-network
    volumes:
      - ./sql:/sql:ro
    command: /bin/bash -c 'cd /sql && /opt/mssql-tools18/bin/sqlcmd -S bikeshopmanager-db -U sa -P "$$MSSQL_SA_PASSWORD" -C -i /sql/init.sql -b'

  bikeshopmanager-api:
    container_name: bikeshopmanager-api
    build: 
      context: .
      dockerfile: Backend/Dockerfile
    ports:
      - "7105:7105"
    volumes:
      - ./certs:/https:ro
    environment:
      - ASPNETCORE_URLS=https://+:7105
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${CERT_PASSWORD}
      - DB_HOST=bikeshopmanager-db
      - DB_NAME=bikeshopmanager
      - DB_MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - BAO_ADDR=${BAO_ADDR}
      - BAO_ROLE_ID=${BAO_ROLE_ID}
      - BAO_SECRET_ID=${BAO_SECRET_ID}
    depends_on:
      bikeshopmanager-db-init:
        condition: service_completed_successfully
      bikeshopmanager-vault:
        condition: service_healthy
    networks:
      - bikeshopmanager-network
  
  bikeshopmanager-vault:
    container_name: bikeshopmanager-vault
    image: openbao/openbao:2.7.2
    command: server
    ports:
      - 8200:8200
    volumes:
      - ./openbao/config:/openbao/config:ro
      - bikeshopmanager-vault-data:/openbao/file
    environment:
      - BAO_ADDR=http://localhost:8200
    networks:
      - bikeshopmanager-network
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 5s
      timeout: 3s
      retries: 20